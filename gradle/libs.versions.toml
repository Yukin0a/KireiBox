[versions]
agp = "8.13.2"
kotlin = "2.2.21"
appcompat = "1.7.1"
activity = "1.8.2"
lifecycle = "2.6.2"
documentfile = "1.1.0"
okhttp = "5.4.0"
retrofit = "2.12.0"
