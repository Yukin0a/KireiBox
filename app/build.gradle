def demoApk = layout.buildDirectory.file("outputs/apk/demo/app-demo.apk")
def demoDeliverable = rootProject.layout.buildDirectory.file("deliverables/KireiBox-demo.1-arm64-v8a.apk")

tasks.register("verifyDemoApk") {
    dependsOn("assembleDemo")
    inputs.file(demoApk)
    doLast {
        def apk = demoApk.get().asFile
        if (!apk.isFile()) throw new GradleException("Missing demo APK: ${apk}")
        def maxBytes = 60L * 1024L * 1024L
        if (apk.length() > maxBytes) {
            throw new GradleException("Demo APK exceeds 60 MiB: ${apk.length()} bytes")
        }

        def requiredEntries = [
            "lib/arm64-v8a/libgame.so",
            "lib/arm64-v8a/libgame134.so",
            "lib/arm64-v8a/libgame126.so",
            "lib/arm64-v8a/libffmpeg.so",
            "lib/arm64-v8a/libkrkr_bridge.so",
            "lib/arm64-v8a/libartemis.so",
            "lib/arm64-v8a/libartemis-compatible.so",
            "lib/arm64-v8a/libartemis-compatible-v2.so",
            "lib/arm64-v8a/libONSPatch.so",
            "assets/libs/Yuri_0.7.6/libonsyuri.so",
            "lib/arm64-v8a/libijkffmpeg.so",
            "lib/arm64-v8a/libijksdl.so",
            "lib/arm64-v8a/libijkplayer.so",
        ] as Set
        def forbiddenText = [
            "chatgpt", "openai", "codex", "claude", "gemini",
            "聊天记录", "聊天内容", "对话记录", "对话内容",
        ]

        def zip = new java.util.zip.ZipFile(apk)
        try {
            def entryNames = zip.entries().collect { it.name } as Set
            def missing = requiredEntries - entryNames
            if (!missing.isEmpty()) {
                throw new GradleException("Demo APK is missing compatibility files: ${missing.join(', ')}")
            }
            def unexpectedAbis = entryNames.findAll {
                it.startsWith("lib/") && !it.startsWith("lib/arm64-v8a/")
            }
            if (!unexpectedAbis.isEmpty()) {
                throw new GradleException("Demo APK contains unexpected ABIs: ${unexpectedAbis.join(', ')}")
            }

            def privacyMatches = []
            zip.entries().each { entry ->
                if (entry.directory) return
                def inspect = entry.name ==~ /classes.*\.dex/ ||
                    entry.name == "resources.arsc" || entry.name.startsWith("assets/")
                if (!inspect || entry.size > 64L * 1024L * 1024L) return
                def text = new String(zip.getInputStream(entry).bytes, java.nio.charset.StandardCharsets.UTF_8)
                    .toLowerCase(java.util.Locale.ROOT)
                forbiddenText.each { term ->
                    if (text.contains(term)) privacyMatches << "${term}@${entry.name}"
                }
            }
            if (!privacyMatches.isEmpty()) {
                throw new GradleException("Demo APK contains chat/development text: ${privacyMatches.unique().join(', ')}")
            }
        } finally {
            zip.close()
        }
        println("Verified demo APK: ${apk.length()} bytes; arm64-v8a; compatibility files complete; privacy scan clean")
    }
}

tasks.register("stageDemoApk", Copy) {
    dependsOn("verifyDemoApk")
    from(demoApk)
    into(rootProject.layout.buildDirectory.dir("deliverables"))
    rename { demoDeliverable.get().asFile.name }
}

tasks.register("verifyLegacySqliteSyntax") {
    doLast {
        def modernUpsert = ~/(?is)\bON\s+CONFLICT\s*\([^)]*\)\s+DO\s+UPDATE\b/
        def offenders = fileTree("src/main") {
            include "**/*.kt", "**/*.java", "**/*.xml", "**/*.sql"
        }.findAll { file -> modernUpsert.matcher(file.getText("UTF-8")).find() }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                "SQLite 3.24 UPSERT syntax is forbidden for legacy OEM compatibility: " +
                    offenders.collect { it.path }.join(", ")
            )
        }
    }
}

// Structural guard (planbook A8): no main-source file may exceed the 800-line hard limit.
// engine/ is a separate third-party module and is intentionally not covered here.
tasks.register("verifyFileSize") {
    doLast {
        def limit = 800
        def offenders = fileTree("src/main") {
            include "**/*.kt", "**/*.java"
        }.files.findAll { it.readLines().size() > limit }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                "Source files over ${limit} lines: " +
                    offenders.collect { "${it.name}(${it.readLines().size()})" }.join(", ")
            )
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("verifyLegacySqliteSyntax")
    dependsOn("verifyFileSize")
}

