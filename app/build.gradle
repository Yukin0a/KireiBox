def releaseSigningFile = rootProject.file("keystore.properties")
def releaseSigningProperties = new Properties()
def releaseSigningConfigured = releaseSigningFile.isFile()
if (releaseSigningConfigured) {
    releaseSigningProperties.load(new FileInputStream(releaseSigningFile))
}

android {
    // Keep the source namespace stable for JNI/reflection and imported engine bridges.
    // The installable identity is the independent com.kireibox.app applicationId above.
    namespace 'com.yuki.yukihub'
    compileSdk 36

    defaultConfig {
        applicationId "com.kireibox.app"
        minSdk 26
        // Android 10 (API 29) needs legacy external storage so the KRKR native
        // engine can write <game>/savedata. requestLegacyExternalStorage only
        // takes effect when targetSdk <= 29; Android 11+ still enforces scoped
        // storage and keeps using MANAGE_EXTERNAL_STORAGE instead.
        targetSdk 29
        versionCode 24
        versionName "0.5.0-alpha.16"

        ndk {
            abiFilters 'arm64-v8a'
        }

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseSigningProperties['releaseStoreFile'])
                storePassword releaseSigningProperties['releaseStorePassword']
                keyAlias releaseSigningProperties['releaseKeyAlias']
                keyPassword releaseSigningProperties['releaseKeyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        demo {
            initWith release
            // Demo packages stay upgrade-compatible with the Huawei-tested debug line.
            // R8/resource shrinking keeps the distributable small while the normal
            // debug variant remains untouched for development diagnostics.
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // The KireiBox shell is Compose-only.
        viewBinding false
        compose true
        buildConfig true
        aidl true
    }

    sourceSets {
        main {
            // KireiBox no longer keeps a second launcher source tree. The only retained
            // asset exclusion is an obsolete MIDI SoundFont from historical checkouts.
            assets.exclude '**/sf.sf2'
            // ExFAT creates AppleDouble sidecars next to new AIDL files. They are metadata,
            // not AIDL source, and must never be passed to the platform compiler.
            aidl.exclude '**/._*'
        }
    }

    androidResources {
        // AssetManager ignore pattern: the obsolete MIDI SoundFont is intentionally
        // excluded from this four-engine demo while remaining in source for rollback.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:sf.sf2"
    }

    packaging {
        pickFirst 'lib/arm64-v8a/libSDL2.so'
        jniLibs {
            // Keep release native libraries compressed in the APK; Android extracts them once
            // at install time, reducing the Alpha distributable without dropping engine files.
            useLegacyPackaging true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/INDEX.LIST',
                '**/._*',
                '**/.DS_Store',
            ]
        }
    }
}

tasks.register("verifyReleaseSigning") {
    doLast {
        def requiredKeys = [
            'releaseStoreFile',
            'releaseStorePassword',
            'releaseKeyAlias',
            'releaseKeyPassword',
        ]
        if (!releaseSigningConfigured || requiredKeys.any { releaseSigningProperties[it]?.trim().isEmpty() != false }) {
            throw new GradleException("Release signing requires ignored local keystore.properties; debug signing fallback is forbidden.")
        }
        def signingStore = file(releaseSigningProperties['releaseStoreFile'])
        if (!signingStore.isFile()) {
            throw new GradleException("Release signing keystore is missing: ${signingStore}")
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "packageRelease") {
        task.dependsOn("verifyReleaseSigning")
    }
}

androidComponents {
    onVariants(selector().withBuildType("demo")) { variant ->
